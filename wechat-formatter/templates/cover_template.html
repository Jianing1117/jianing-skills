<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信封面 - {{TITLE}}</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #e8e8e8;
  font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
}

.cover-container {
  width: 900px;
  height: 383px;
  background: #FFFFFF;
  position: relative;
  overflow: hidden;
  padding: 0 72px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* 英文标签 — 窄体大写，杂志目录式 */
.label {
  font-size: 11px;
  color: #607EA5;
  letter-spacing: 5px;
  text-transform: uppercase;
  font-weight: 500;
  margin: 0 0 16px;
}

/* 主标题 — 宋体衬线，出版物气质 */
.main-title {
  font-family: 'Songti SC', 'Source Han Serif SC', 'Noto Serif CJK SC', serif;
  font-size: 46px;
  color: #171717;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: 3px;
  margin: 0 0 20px;
  max-width: 720px;
}

/* 描述 — 注脚灰，无衬线，与宋体标题形成软硬对比 */
.description {
  font-size: 14px;
  color: #77787A;
  line-height: 1.6;
  letter-spacing: 0.5px;
  margin: 0;
  max-width: 480px;
}

/* 右上角色签 — 一小处主色 */
.color-tag {
  position: absolute;
  top: 0;
  right: 72px;
  width: 48px;
  height: 4px;
  background: #B8D9EA;
}

/* 底部品牌标识 — 左下角，与正文同一条左边线 */
.wordmark {
  position: absolute;
  bottom: 32px;
  left: 72px;
  height: 26px;
  opacity: 0.8;
}
</style>
</head>
<body>

<div class="cover-container">
  <div class="color-tag"></div>

  <p class="label">{{SUBTITLE}}</p>

  <h1 class="main-title">{{TITLE}}</h1>

  <p class="description">{{DESCRIPTION}}</p>

  <img class="wordmark" src="wordmark.png" alt="加宁慢慢来">
</div>

</body>
</html>
